*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:100}

.top{background:var(--red);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 0 rgba(0,0,0,.18)}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#b5000e}}
.topin{max-width:1060px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:1.15rem;letter-spacing:.2px;min-height:44px;background:none;border:0;padding:0}
.brand .dot{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--red-d);display:grid;place-items:center;font-size:1.2rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}

.spacer{flex:1}

.lang button[aria-pressed="true"]{background:#fff;color:var(--red-d)}
.theme{font-size:1.1rem;padding:6px}
/* Layout */
main{max-width:1060px;margin:0 auto;padding:20px 16px 90px;outline:none}
.hero{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden;border:2px solid var(--line)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--red-l)}
.hero>*{position:relative}
.hero h1{margin:0 0 6px;font-size:clamp(1.5rem,4.5vw,2.2rem);line-height:1.2}
.hero p{margin:0 0 12px;color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}

.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:background .6s}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.3rem}
h2.sec{margin:28px 0 12px;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lcard{--c:var(--red);text-align:left;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .18s,box-shadow .18s;animation:pop .5s both}
.lcard:hover{transform:translateY(-4px) rotate(-.4deg)}
.lcard:active{transform:translateY(1px)}
.lcard .ico{font-size:2rem;line-height:1}
.lcard h3{margin:0;font-size:1.08rem;line-height:1.3}
.lcard p{margin:0;color:var(--mute);font-size:.92rem}
.lcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--mute);font-weight:700}
.stars{letter-spacing:2px;font-size:1.15rem}
.stars .off{opacity:.3;filter:grayscale(1)}
.nr{font-weight:800;color:var(--c)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:0;background:var(--red-d);color:#fff;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s;text-decoration:none}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:#d0101f}}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.crumb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.back{min-height:44px;background:none;border:0;color:var(--blue);font-weight:800;padding:6px 4px}
/* Lektion */
.lhead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lhead .big{font-size:3rem;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
.lhead h1{margin:0;font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.25}
.lhead p{margin:0;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow);animation:pop .5s both}
.card h2{margin:0 0 6px;font-size:1.1rem}
.card p{margin:0}
.card .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--red-d);color:#fff;font-weight:800;margin-right:8px;font-size:.9rem}
.bubble{background:var(--gold);color:#3b2d00;border-radius:22px 22px 22px 6px;padding:14px 18px;margin:18px 0;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.12);animation:pop .5s .25s both}
:root[data-theme="dark"] .bubble{color:#2a2000}
.bubble small{display:block;font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:.75rem;margin-bottom:2px}
details.pro{background:var(--card);border:2px dashed var(--c,var(--red));border-radius:var(--r);padding:0;margin:0 0 14px}
details.pro summary{min-height:48px;padding:12px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.pro summary::-webkit-details-marker{display:none}
details.pro summary::before{content:"\1F3C6";font-size:1.2rem}
details.pro[open] summary::before{content:"\2B50"}
details.pro p{margin:0;padding:0 18px 16px}
.src{font-size:.9rem;color:var(--mute);margin:16px 0}
.src ul{margin:6px 0 0;padding-left:20px}
.src li{margin:4px 0}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;margin-top:18px}
/* Quiz */
.dots{display:flex;gap:6px;margin:0 0 16px}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--ok)}
.dots i.no{background:var(--bad)}
.dots i.cur{background:var(--blue)}
.qq{font-size:clamp(1.15rem,3.8vw,1.5rem);line-height:1.35;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:56px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(3px)}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.right{background:var(--okbg);border-color:var(--ok);animation:hop .45s}
.opt.wrong{background:var(--badbg);border-color:var(--bad);animation:shake .4s}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.dim{opacity:.7}
@keyframes hop{30%{transform:scale(1.03) translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin:16px 0 0;padding:14px 16px;border-radius:16px;font-weight:600}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.res{text-align:center;padding:10px 0}

.res .bigstars span{display:inline-block;animation:star .6s both}
.res .bigstars span:nth-child(2){animation-delay:.2s}.res .bigstars span:nth-child(3){animation-delay:.4s}
.res .bigstars .off{animation:none;color:#8a8c92}
@keyframes star{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
.res h1{margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
footer{max-width:1060px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:.88rem}
footer p{margin:6px 0}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:560px){

.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 4px}

.choice{display:flex;gap:14px;align-items:center;text-align:left;min-height:84px;padding:14px 20px;border-radius:22px;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:transform .15s;animation:pop .5s .1s both}
.choice:hover{transform:translateY(-3px)}
.choice .ci{font-size:2.2rem;line-height:1}
.choice b{display:block;font-size:1.15rem}
.choice small{display:block;font-size:.92rem;opacity:.92}
.choice.pri{background:var(--red-d);color:#fff;border-color:transparent}
.ach{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--gold);color:#3b2d00;font-weight:800;animation:pop .5s both}
.pitch{text-align:center;color:var(--mute);margin:10px 0 0;font-weight:700}
@media(max-width:560px){.choices{grid-template-columns:1fr}}.certbox{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);margin:14px 0;animation:pop .5s both}
.certbox svg{display:block;width:100%;height:auto;border-radius:12px}
.field{display:grid;gap:6px;margin:14px 0}
.field label{font-weight:800}
.field input{min-height:48px;font:inherit;font-size:1rem;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.certlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.certlist .btn{justify-content:flex-start;text-align:left;border-radius:16px;min-height:52px;width:100%}
.btn.mastercard{background:#ffc800!important;color:#3b2d00;border:0;box-shadow:0 4px 0 rgba(0,0,0,.2)}
@page{size:A4 landscape;margin:8mm}
@media print{body{background:#fff}main>*:not(.certbox){display:none!important}.certbox{box-shadow:none;border:0;padding:0;margin:0}footer{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.top,.sticky,.lang{display:none}}

}

function answer(l, pos){

function certBlock(m, l){

const CT = {

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function wrap(s, n){

const earned = l => starsOf(prog[l.id], l.q.length) >= 1;

function certSVG(l){

  const band = ["#e60012","#0b6aa8","#ffc800","#1b7a3d","#6b3fa0"].map((c, i) => '<rect x="' + (60 + i*200.6) + '" y="36" width="200.6" height="16" fill="' + c + '"/>').join("");
  const conf = [[110,150,"#0b6aa8"],[1010,170,"#ffc800"],[130,640,"#1b7a3d"],[1000,650,"#6b3fa0"],[90,330,"#ffc800"],[1030,360,"#e60012"],[160,230,"#e60012"],[960,250,"#1b7a3d"]].map(a => '<rect x="' + a[0] + '" y="' + a[1] + '" width="16" height="16" rx="3" transform="rotate(' + (a[0]%40-20) + ' ' + a[0] + ' ' + a[1] + ')" fill="' + a[2] + '"/>').join("");

   + '<text x="561.5" y="190" text-anchor="middle" font-size="22" fill="#4d4f54" ' + F + '>' + esc(g("conf")) + '</text>'
   + '<text x="561.5" y="270" text-anchor="middle" font-size="' + nsz + '" font-weight="800" fill="' + (n ? "#1f2026" : "#b8b9bd") + '" ' + F + '>' + esc(n || t("nameP")) + '</text>'

function renderCert(l){
  const m = $("#main"); m.replaceChildren(); const M = !l;
  m.append(h("div", {class:"crumb"}, h("button", {type:"button", class:"back", onclick:() => go("home")}, t("back"))));

  const nameSafe = (nm.trim() || "name").replace(/[^\p{L}\p{N}]+/gu, "_");
  m.append(h("div", {class:"row"},
    h("button", {type:"button", class:"btn", onclick:() => savePng(certSVG(l), "nintendo_quest_" + (M ? "master" : l.id) + "_" + nameSafe + ".png")}, "⬇ " + t("dl")),

    h("button", {type:"button", class:"btn ghost", onclick:() => go("home")}, t("over"))));

function savePng(svg, name){
  const url = URL.createObjectURL(new Blob([svg], {type:"image/svg+xml;charset=utf-8"})), img = new Image();
  img.onload = () => { const c = document.createElement("canvas"); c.width = 1123; c.height = 794; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 1123, 794); x.drawImage(img, 0, 0); URL.revokeObjectURL(url); c.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.append(a); a.click(); a.remove(); }); };
  img.src = url;
}
function certList(){
  const got = LESSONS.filter(earned); const w = h("section", {"aria-labelledby":"ch"}); 
  w.append(h("h2", {class:"sec", id:"ch", text:"🏅 " + t("certs")}), h("p", {style:"margin:0 0 12px;color:var(--mute)", text:t("certsHint")}));
  const g = h("div", {class:"certlist"});
  if(allEarned()) g.append(h("button", {type:"button", class:"btn mastercard", onclick:() => go("cert", "master")}, "👑 " + t("master")));
  got.forEach(l => g.append(h("button", {type:"button", class:"btn ghost", onclick:() => go("cert", l.id)}, l.ico + " " + l.t[li])));
  w.append(g); return got.length ? w : h("section");
}/* ---------- Routing ---------- */
function go(v, id){ view = {v, id}; location.hash = v === "home" ? "home" : v + "-" + id; render(); }
function fromHash(){
  const x = (location.hash || "").slice(1); const m = x.match(/^(lesson|quiz|cert)-(.+)$/); const known = m && LESSONS.some(l => l.id === m[2]);
  if(m && m[1] === "cert" && (m[2] === "master" ? allEarned() : known && earned(LESSONS[idxOf(m[2])]))) view = {v:"cert", id:m[2]};
  else if(known && m[1] === "quiz"){ if(view.v !== "quiz" && view.v !== "result") view = {v:"lesson", id:m[2]}; }
  else if(known && m[1] === "lesson") view = {v:"lesson", id:m[2]};
  else view = {v:"home"};
}let lastKey = "";
function render(keepScroll){
  const l = view.id ? LESSONS[idxOf(view.id)] : null;
  if(view.v === "lesson") renderLesson(l); else if(view.v === "quiz") renderQuiz(l); else if(view.v === "result") renderResult(l); else if(view.v === "cert") renderCert(l); else renderHome();
